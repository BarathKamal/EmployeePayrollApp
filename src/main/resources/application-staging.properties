# Logging Levels
logging.level.root=INFO
logging.level.com.bridgelabz.employeepayrollapp=DEBUG

# Console Logging
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%level] %logger{36} - %msg%n

# File Logging
logging.file.name=logs/employee-payroll-staging.log
logging.file.max-size=20MB
logging.file.max-history=14

spring.datasource.url=jdbc:mysql://localhost:3306/payroll_service
spring.datasource.username=root
spring.datasource.password=password

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true